<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Survive the New Fascist Europe — Fabio Bego</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #050805;
            color: #7CFF00;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
        }

        .page {
            max-width: 1000px;
            margin: auto;
        }

        .site-header {
            border-top: 2px solid #7CFF00;
            border-bottom: 2px solid #7CFF00;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .site-name {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .back-link {
            color: #7CFF00;
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 1px;
            transition: color 0.15s ease;
        }

        .back-link:hover {
            color: #B6FF66;
        }

        .content-frame {
            border: 2px solid #7CFF00;
            padding: 80px 20px;
            background: #000000;
            text-align: center;
        }

        /* Intermittent Blinking "COMING SOON" */
        .coming-soon-box {
            font-size: 28px;
            letter-spacing: 4px;
        }

        .blink {
            animation: blinker 1.2s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        @media (max-width: 700px) {
            body { padding: 15px; }
            .content-frame { padding: 50px 15px; }
            .site-name { font-size: 16px; }
            .coming-soon-box { font-size: 20px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
<div class="page">

    <header class="site-header">
        <div class="site-name">FABIO BEGO</div>
        <a href="index.html" class="back-link">&lt; BACK</a>
    </header>

    <main class="content-frame">
        <div class="coming-soon-box">
            <span class="blink">COMING SOON</span>
        </div>
    </main>

</div>
</body>
</html>
